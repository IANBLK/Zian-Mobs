plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.147' }
group='com.ianblk.zianmobs'
version=mod_version
base { archivesName='zianmobs' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url='https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
neoForge {
 version='21.1.259'
 accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
 runs { consolidationClientSmoke { client(); gameDirectory=project.file("build/consolidation-client-smoke"); programArguments.addAll("--width","1920","--height","1080"); jvmArgument "-Xmx3G" }; stageClientSmoke { client(); gameDirectory=project.file("build/stage-client-smoke"); programArguments.addAll("--width","1920","--height","1080"); jvmArgument "-Xmx3G" }; clientSceneSmoke { client(); gameDirectory=project.file("build/mobs-scene-client"); systemProperty "zianmobs.scene","true"; systemProperty "zianmobs.flightScene",project.findProperty("flightScene") ?: "false"; systemProperty "zianmobs.attackScene",project.findProperty("attackScene") ?: "false"; systemProperty "zianmobs.eyeFocus",project.findProperty("eyeFocus") ?: "false"; programArguments.addAll("--width","1920","--height","1080","--quickPlaySingleplayer","companions-scene"); jvmArgument "-Xmx3G" }; client { client() }; clientSmoke { client(); gameDirectory=project.file("build/mobs-client-smoke-companions"); systemProperty "zianmobs.clientSmoke","true"; systemProperty "zianmobs.shadowFocus",project.findProperty("shadowFocus") ?: "false"; systemProperty "zianmobs.itemFocus",project.findProperty("itemFocus") ?: "false"; systemProperty "zianmobs.clientSmokeStart",project.findProperty("clientSmokeStart") ?: "0"; programArguments.addAll("--width","1920","--height","1080"); jvmArgument "-Xmx3G" }; server { server(); programArgument '--nogui' }; mobsSmoke { server(); gameDirectory=project.file(project.findProperty('smokeDir') ?: 'build/mobs-smoke'); programArgument '--nogui'; systemProperty 'zianmobs.smoke','true'; systemProperty 'zianmobs.clientFixtures',project.file('build/mobs-client-smoke-companions/fixtures').absolutePath; jvmArgument '-Xmx3G' } }
 mods { zianmobs { sourceSet sourceSets.main } }
}
dependencies {
 if(project.hasProperty('geckolibJar')) implementation files(project.property('geckolibJar'))
 else implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
 testImplementation platform('org.junit:junit-bom:5.13.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testImplementation 'com.google.code.gson:gson:2.10.1'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test',Test) { useJUnitPlatform(); if(System.getProperty('os.name').toLowerCase().contains('windows')) systemProperty 'junit.jupiter.tempdir.cleanup.mode.default','NEVER'; systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('test-tmp').get().asFile.absolutePath; doFirst { layout.buildDirectory.dir('test-tmp').get().asFile.mkdirs() } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.named('processResources') { inputs.property('mod_version',mod_version); filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version:mod_version) } }
tasks.named('jar') { from('LICENSE') { into 'META-INF' } }

configurations { sqliteBundled { transitive = false } }
dependencies { if(project.hasProperty("sqliteJdbcJar")) sqliteBundled files(project.property("sqliteJdbcJar")); else sqliteBundled "org.xerial:sqlite-jdbc:3.53.4.0" }
tasks.named("processResources") { from(configurations.sqliteBundled) { into "META-INF/zian-libraries"; rename { "sqlite-jdbc.jar" } } }

// Minecraft can halt normally after a test failure. Require the explicit harness receipt.
tasks.named('runMobsSmoke') { doFirst { project.delete(project.file((project.findProperty('smokeDir') ?: 'build/mobs-smoke')+'/world/smoke-result.txt')) }; doLast {
 def receipt=project.file((project.findProperty('smokeDir') ?: 'build/mobs-smoke')+'/world/smoke-result.txt')
 if(!receipt.isFile() || !receipt.getText('UTF-8').startsWith('PASS:')) throw new GradleException('Zian Mobs server smoke did not pass; inspect its log and receipt.')
} }
tasks.named('runClientSmoke') { doFirst { project.delete(project.file('build/mobs-client-smoke-companions/client-smoke-result.txt')) }; doLast {
 def receipt=project.file('build/mobs-client-smoke-companions/client-smoke-result.txt')
 if(!receipt.isFile() || !receipt.getText('UTF-8').startsWith('PASS:')) throw new GradleException('Zian Mobs client smoke did not pass; inspect its log and receipt.')
} }

 tasks.named('runClientSceneSmoke') { doFirst { if(project.hasProperty('flightScene')) project.delete(project.file('build/mobs-scene-client/armor-fit-result.txt'));  project.delete(project.file('build/mobs-scene-client/'+(project.hasProperty('flightScene')?'flight-scene-result.txt':project.hasProperty('attackScene')?'attack-scene-result.txt':project.hasProperty('eyeFocus')?'eyes-result.txt':'scene-result.txt'))) }; doLast {
 def receipt=project.file('build/mobs-scene-client/'+(project.hasProperty('flightScene')?'flight-scene-result.txt':project.hasProperty('attackScene')?'attack-scene-result.txt':project.hasProperty('eyeFocus')?'eyes-result.txt':'scene-result.txt'))
 if(!receipt.isFile() || !receipt.getText('UTF-8').startsWith('PASS:')) throw new GradleException('Companion scene did not pass; inspect its receipt and screenshots.')
 if(project.hasProperty('flightScene')) { def armor=project.file('build/mobs-scene-client/armor-fit-result.txt'); if(!armor.isFile() || !armor.getText('UTF-8').startsWith('PASS:')) throw new GradleException('Slim/wide armor preview did not pass.') }
 } }

// Optional local integration test only; these third-party mods are never bundled.
dependencies { if(project.hasProperty('supplementariesJar')) runtimeOnly files(project.property('supplementariesJar')); if(project.hasProperty('moonlightJar')) runtimeOnly files(project.property('moonlightJar')) }

dependencies { if(project.hasProperty('irisJar')) runtimeOnly files(project.property('irisJar')) }

dependencies { if(project.hasProperty('sodiumJar')) runtimeOnly fileTree(dir:'build/shader-runtime',include:['fabric-*.jar','sodium-dev-combined.jar']) }

// Optional local verification of the bridge; never bundled or required by Zian Mobs.
dependencies { if(project.hasProperty("managerJar")) runtimeOnly files(project.property("managerJar")) }

['StageClientSmoke':'stage-client-smoke/stage-client-pass.txt','ConsolidationClientSmoke':'consolidation-client-smoke/consolidation-client-pass.txt'].each { runName, receiptName ->
 tasks.named('run'+runName) { doFirst { project.delete(project.file('build/'+receiptName)) }; doLast { def receipt=project.file('build/'+receiptName); if(!receipt.isFile() || !receipt.getText('UTF-8').startsWith('PASS:')) throw new GradleException('Client verification failed; inspect the explicit receipt and log.') } }
}
